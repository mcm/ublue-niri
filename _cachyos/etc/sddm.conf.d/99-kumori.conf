# Kumori SDDM configuration (CachyOS / Arch).
#
# Named 99- deliberately. SDDM loads /usr/lib/sddm/sddm.conf.d/*.conf, then
# /etc/sddm.conf.d/*.conf (both alphabetically), then /etc/sddm.conf last.
# Later wins, so a 10- prefix loses to almost anything a distro ships. If an
# /etc/sddm.conf exists with [Theme] or [General] keys it still beats this file
# — install.sh warns when it finds one.
#
# Wayland greeter on weston, NOT cage. The bootc image uses `cage -s` because
# Fedora's weston kiosk shell drew no cursor. Neither half of that reasoning
# holds here: Arch's weston renders the cursor correctly, and `cage -s` with no
# application argument has no exit condition — it keeps running after the
# greeter client disconnects, holds DRM master, and the niri session comes up to
# a frozen screen. weston has a primary client, exits with it, and releases the
# VT cleanly.
#
# No DisplayServer=x11 fallback here on purpose: X11 works but drags in
# xorg-server plus xorg-xrdb/xorg-xsetroot (SDDM shells out to both to apply
# CursorTheme, and silently skips the cursor when they are missing).
#
# The greeter theme must declare QtVersion=6 in its metadata.desktop or SDDM
# launches the Qt5 greeter binary, which does not exist on Arch — the greeter
# dies instantly with exit 127 and you get a black screen. install.sh ensures it.

[General]
DisplayServer=wayland

[Theme]
Current=precision-overcast
CursorTheme=Simp1e-Precision-Overcast
# 48 physical px: weston runs the greeter at scale 1. niri sets 24 logical and
# auto-scales the HiDPI output x2, landing at the same ~48. Don't unify them.
CursorSize=48

[Wayland]
CompositorCommand=weston --shell=kiosk
